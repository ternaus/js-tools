name: Set up workspace
description: Install the Node.js runtime and pinned pnpm workspace dependencies.
inputs:
  node-version:
    description: Node.js version
    default: "24"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
    - uses: pnpm/action-setup@v5
      with:
        run_install: true
